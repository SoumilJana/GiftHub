<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GiftHub Circle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F2F6;
  --surface:#FFFFFF;
  --ink:#20233F;
  --muted:#5D6280;
  --line:#DCDFE8;
  --ribbon:#B0174F;
  --ribbon-deep:#8C0F3D;
  --ribbon-soft:#F8E4EB;
  --sale:#1C7350;
  --sale-soft:#E2F2EA;
  --focus:#3B5BDB;
  --r-tile:12px;
  --r-ctl:8px;
  --font:"Schibsted Grotesk",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--font);font-feature-settings:"tnum" 0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* shell */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:28px;position:sticky;top:0;height:100vh}
.mark{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.02em;padding:0 8px}
.mark svg{flex:none}
.side h2{font-size:13px;font-weight:600;color:var(--muted);margin:0 8px 6px}
.side nav a,.circle-link{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px;border-radius:var(--r-ctl);color:inherit;text-decoration:none;font-weight:500}
.side nav a:hover,.circle-link:hover{background:#E6E8EF}
.circle-link[aria-current="page"]{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;font-size:13px;color:var(--muted);padding:0 8px}
.side-foot b{color:var(--ink);font-weight:600}

main{padding:28px clamp(16px,3.4vw,44px) 96px;min-width:0}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px}
.top h1{font-size:clamp(28px,3.6vw,40px);line-height:1.05;letter-spacing:-.03em;font-weight:800;margin:0}
.next{margin:8px 0 0;color:var(--muted)}
.next strong{color:var(--ink);font-weight:600}

.add{display:flex;gap:8px;flex:1 1 360px;max-width:520px}
.add input{flex:1;min-width:0;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--surface)}
.add input::placeholder{color:#8A8FA8}
.btn{height:44px;padding:0 16px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#B9BDCC}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#2E3258}

/* member tabs */
.tabs{display:flex;gap:4px;margin:30px 0 0;border-bottom:1px solid var(--line)}
.tab{appearance:none;border:0;background:none;padding:10px 4px 12px;margin-right:20px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);border-radius:2px}
.tab .count{margin-left:6px}

.tools{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin:18px 0 22px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tools-right{margin-left:auto;display:flex;gap:12px;align-items:center}
.sort{height:34px;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--surface);padding:0 10px;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-ctl);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;height:32px;padding:0 12px;font-size:14px;font-weight:500;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:#E6E8EF;color:var(--ink)}

.asmaya{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
.switch{width:36px;height:20px;border-radius:999px;background:#C9CCD9;position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.asmaya input:checked + .switch{background:var(--ink)}
.asmaya input:checked + .switch::after{transform:translateX(16px)}
.asmaya input:focus-visible + .switch{outline:2px solid var(--focus);outline-offset:2px}

.note{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-ctl);background:var(--surface);border:1px solid var(--line);margin:0 0 20px;font-size:14px;color:var(--muted);max-width:72ch}
.note strong{color:var(--ink);font-weight:600}
.note svg{flex:none;margin-top:2px}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:28px 22px}
.item{display:flex;flex-direction:column;min-width:0}
.tile{position:relative;aspect-ratio:4/3;border-radius:var(--r-tile);overflow:hidden;display:grid;place-items:center}
.tile svg.art{width:58%;height:auto;color:var(--ink);opacity:.82}
.sale{position:absolute;left:10px;top:10px;background:var(--sale-soft);color:var(--sale);font-size:12.5px;font-weight:700;padding:3px 8px;border-radius:6px}

/* the ribbon: claimed items get wrapped */
.ribbon{position:absolute;inset:0;pointer-events:none}
.ribbon::before,.ribbon::after{content:"";position:absolute;background:var(--ribbon);box-shadow:0 0 0 1px rgba(255,255,255,.15) inset}
.ribbon::before{left:calc(68% - 9px);top:0;bottom:0;width:18px;transform-origin:top;transform:scaleY(0)}
.ribbon::after{top:calc(58% - 9px);left:0;right:0;height:18px;transform-origin:left;transform:scaleX(0)}
.ribbon .bow{z-index:1;position:absolute;left:68%;top:58%;width:44px;height:30px;transform:translate(-50%,-50%) scale(0);color:var(--ribbon-deep)}
.claimed .ribbon::before{transform:scaleY(1);transition:transform .38s cubic-bezier(.2,.7,.2,1)}
.claimed .ribbon::after{transform:scaleX(1);transition:transform .38s .16s cubic-bezier(.2,.7,.2,1)}
.claimed .ribbon .bow{transform:translate(-50%,-50%) scale(1);transition:transform .32s .42s cubic-bezier(.3,1.5,.5,1)}
.claimed.bought .ribbon::before,.claimed.bought .ribbon::after{background:var(--ribbon-deep)}
.claimed.bought .ribbon .bow{color:#5A0725}
.claimed .tile svg.art{opacity:.45}

.meta{padding:12px 2px 0;display:flex;flex-direction:column;gap:6px;flex:1}
.store{font-size:13px;color:var(--muted)}
.title{font-weight:600;font-size:15.5px;line-height:1.3;margin:0}
.title a{color:inherit;text-decoration:none}
.title a:hover{text-decoration:underline;text-underline-offset:3px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:2px}
.price{font-weight:700;font-variant-numeric:tabular-nums}
.price s{font-weight:400;color:var(--muted);margin-left:6px;font-size:14px}
.prio{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.meter{display:flex;gap:2px}
.meter i{width:4px;height:12px;border-radius:1px;background:#D3D6E2}
.meter i.on{background:var(--ink)}
.occ{font-size:13px;color:var(--muted)}

.claim{margin-top:10px;display:flex;gap:8px;align-items:center;min-height:36px}
.claim .btn{height:36px;padding:0 14px;font-size:14px}
.status{font-size:14px;font-weight:600;color:var(--ribbon)}
.linkbtn{border:0;background:none;padding:6px 2px;font-size:14px;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--ink)}
.other{font-size:14px;color:var(--muted)}

/* list view */
.list{border-top:1px solid var(--line)}
.lrow{display:grid;grid-template-columns:56px minmax(0,1fr) 120px 150px 190px;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.lrow .tile{width:56px;aspect-ratio:1;border-radius:8px}
.lrow .tile svg.art{width:76%}
.lrow .ribbon::before{width:6px;left:calc(68% - 3px)}
.lrow .ribbon::after{height:6px;top:calc(58% - 3px)}
.lrow .ribbon .bow{display:none}
.lrow .claim{margin:0;justify-content:flex-end}
.lrow .meta{padding:0;gap:2px}

/* owner preview: claims vanish */
.preview .ribbon,.preview .claim,.preview .status{display:none}
.preview .tile svg.art{opacity:.82}

.empty{padding:48px 0;color:var(--muted);max-width:52ch}
.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;font-size:14px;max-width:calc(100vw - 32px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}

.mobilebar,.bottomnav{display:none}

@media (max-width:899px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .mobilebar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:5}
  .mobilebar .mark{padding:0;font-size:17px}
  .mobilebar select{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-ctl);height:36px;padding:0 8px;font-weight:600;max-width:55vw}
  main{padding:20px 16px 110px}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
  .bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 10px;font-size:12px;font-weight:600;color:var(--muted);text-decoration:none}
  .bottomnav a[aria-current="page"]{color:var(--ink)}
  .add{flex-basis:100%;max-width:none}
  .tools-right{margin-left:0;width:100%;flex-wrap:wrap;gap:12px}
  .asmaya{flex-basis:100%}
  .sort{flex:1;min-width:0}
  .chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none;width:calc(100% + 32px)}
  .chip{flex:none}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px}
  .title{font-size:14.5px}
  .claim .btn{padding:0 12px}
  .claim{flex-wrap:wrap;gap:2px 10px}
  .claim .status{flex-basis:100%}
  .toast{bottom:84px}
  .lrow{grid-template-columns:56px minmax(0,1fr) auto;row-gap:6px}
  .lrow .cell-prio,.lrow .cell-occ{display:none}
  .lrow .claim{grid-column:2 / -1;justify-content:flex-start}
}
@media (max-width:420px){
  .row{flex-direction:column;align-items:flex-start;gap:4px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Main">

<script>
const fmt = (n, c) => new Intl.NumberFormat(undefined,{style:"currency",currency:c}).format(n);
const BANDS = p => p>=9 ? "Must have" : p>=6 ? "Would love" : "Nice to have";
const OCCASIONS = ["Birthday","Anniversary","Holiday","Valentine’s Day","Just because"];

const data = {
  maya: [
    {id:1,title:"75% low-profile mechanical keyboard, brown switches",store:"keychron.com",price:169,currency:"USD",priority:9,occ:"Birthday",tint:"#E3E7F4",art:"keyboard",added:3,claim:null},
    {id:2,title:"The Left Hand of Darkness, illustrated edition",store:"foliosociety.com",price:75,currency:"GBP",priority:8,occ:"Anniversary",tint:"#F3E6DF",art:"book",added:9,claim:{by:"you",state:"bought"}},
    {id:3,title:"Linen overshirt in sage, size M",store:"uniqlo.com",price:39.9,currency:"GBP",priority:7,occ:"Birthday",tint:"#E2EEE6",art:"shirt",added:5,claim:null},
    {id:4,title:"Ethiopia Guji, whole bean, 350 g",store:"squaremilecoffee.com",price:14.5,was:17,currency:"GBP",priority:6,occ:"Just because",tint:"#EFE8DA",art:"coffee",added:1,claim:null},
    {id:5,title:"Hand-thrown ceramic pour-over dripper",store:"etsy.com",price:48,currency:"USD",priority:6,occ:"Holiday",tint:"#E7E3F1",art:"dripper",added:12,claim:{other:true}},
    {id:6,title:"Merino hiking socks, three pairs",store:"darntough.com",price:72,currency:"USD",priority:5,occ:"Holiday",tint:"#F1E4E9",art:"socks",added:7,claim:null},
    {id:7,title:"Foldable travel hair dryer",store:"amazon.de",price:29.99,was:34.99,currency:"EUR",priority:3,occ:"Just because",tint:"#E4ECF1",art:"dryer",added:2,claim:null},
  ],
  you: [
    {id:11,title:"Brass fountain pen, fine nib",store:"kaweco-pen.com",price:89,currency:"EUR",priority:9,occ:"Birthday",tint:"#EFE8DA",art:"pen",added:4,hidden:"Maya"},
    {id:12,title:"Small olive tree, 60 cm",store:"bloomandwild.com",price:55,currency:"GBP",priority:7,occ:"Anniversary",tint:"#E2EEE6",art:"plant",added:6},
    {id:13,title:"Pleated paper table lamp",store:"muji.com",price:45,currency:"EUR",priority:4,occ:"Just because",tint:"#E3E7F4",art:"lamp",added:2},
  ]
};

const state = {who:"maya", occ:"All", sort:"prio", view:"grid", asMaya:false};
const $ = s => document.querySelector(s);

function chips(){
  const el = $("#chips"); el.innerHTML = "";
  ["All",...OCCASIONS].forEach(o=>{
    const b=document.createElement("button");
    b.className="chip"; b.type="button"; b.textContent=o;
    b.setAttribute("aria-pressed", String(o===state.occ));
    b.onclick=()=>{state.occ=o; chips(); render();};
    el.appendChild(b);
  });
}

function meter(p){ return `<span class="meter" aria-hidden="true">${Array.from({length:10},(_,i)=>`<i class="${i<p?"on":""}"></i>`).join("")}</span>`; }

function claimUI(it){
  if(state.who!=="maya") {
    return `<div class="claim"><button class="linkbtn" data-act="received" data-id="${it.id}">Mark received</button></div>`;
  }
  if(it.claim?.other) return `<div class="claim"><span class="other">Claimed in Friday dinner crew</span></div>`;
  if(!it.claim) return `<div class="claim"><button class="btn" data-act="reserve" data-id="${it.id}">Reserve</button><button class="linkbtn" data-act="bought" data-id="${it.id}">I bought it</button></div>`;
  if(it.claim.state==="reserved") return `<div class="claim"><span class="status">Reserved by you</span><button class="linkbtn" data-act="bought" data-id="${it.id}">Mark bought</button><button class="linkbtn" data-act="undo" data-id="${it.id}">Undo</button></div>`;
  return `<div class="claim"><span class="status">Bought by you</span><button class="linkbtn" data-act="undo" data-id="${it.id}">Undo</button></div>`;
}

function tile(it){
  const c = state.who==="maya" && it.claim;
  const cls = c ? `claimed ${it.claim.state==="bought"||it.claim.other?"bought":""}` : "";
  return `<div class="tile ${cls}" style="background:${it.tint}">
    <svg class="art" viewBox="0 0 120 80" aria-hidden="true"><use href="#a-${it.art}"/></svg>
    ${it.was && !(state.view==="list") ? `<span class="sale">Sale</span>`:""}
    <span class="ribbon" aria-hidden="true"><svg class="bow"><use href="#bow"/></svg></span>
  </div>`;
}

function priceHTML(it){
  return `<span class="price">${fmt(it.price,it.currency)}${it.was?`<s aria-label="was">${fmt(it.was,it.currency)}</s>`:""}</span>`;
}

function render(){
  const list = data[state.who].filter(i=>state.occ==="All"||i.occ===state.occ).slice();
  list.sort((a,b)=> state.sort==="prio" ? b.priority-a.priority : state.sort==="low" ? a.price-b.price : a.added-b.added);

  $("#heading").textContent = state.who==="maya" ? "Maya’s list" : "Your list";
  $("#next").innerHTML = state.who==="maya"
    ? `<strong>Maya’s birthday</strong> is in 23 days, on 9 December.`
    : `Shared with Maya &amp; Sam and Friday dinner crew.`;
  $("#c-maya").textContent = data.maya.length; $("#c-you").textContent = data.you.length;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected", String(t.dataset.who===state.who)));
  $("#items").setAttribute("aria-labelledby", "tab-"+state.who);
  $("#asmayaWrap").style.display = state.who==="maya" ? "" : "none";

  const owner = state.who==="you";
  const preview = state.who==="maya" && state.asMaya;
  $("#noteSlot").innerHTML = owner
    ? note(`<strong>You won’t see who is buying what.</strong> Claims on your items stay hidden until you mark an item received.`)
    : preview
    ? note(`<strong>This is what Maya sees.</strong> Her list looks untouched. Claims are never sent to her device.`)
    : "";

  const wrap = $("#items");
  wrap.classList.toggle("preview", preview);
  if(!list.length){
    wrap.innerHTML = `<div class="empty"><strong>Nothing tagged ${state.occ} yet.</strong>${owner?"Add an item and tag it with this occasion so Maya can find it.":"Try another occasion, or look at everything Maya has added."}</div>`;
    return;
  }
  if(state.view==="grid"){
    wrap.innerHTML = `<div class="grid">${list.map(it=>`
      <article class="item">
        ${tile(it)}
        <div class="meta">
          <span class="store">${it.store}</span>
          <h3 class="title"><a href="#">${it.title}</a></h3>
          <div class="row">${priceHTML(it)}<span class="prio" title="Priority ${it.priority} of 10">${meter(it.priority)}${BANDS(it.priority)}</span></div>
          <span class="occ">${it.occ}</span>
          ${claimUI(it)}
        </div>
      </article>`).join("")}</div>`;
  } else {
    wrap.innerHTML = `<div class="list">${list.map(it=>`
      <article class="lrow">
        ${tile(it)}
        <div class="meta"><span class="store">${it.store}</span><h3 class="title"><a href="#">${it.title}</a></h3></div>
        <div>${priceHTML(it)}${it.was?`<div class="occ" style="color:var(--sale);font-weight:600">On sale</div>`:""}</div>
        <div class="cell-prio prio" title="Priority ${it.priority} of 10">${meter(it.priority)}${it.priority}</div>
        ${claimUI(it)}
      </article>`).join("")}</div>`;
  }
}

function note(html){
  return `<p class="note"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 7V5a2.5 2.5 0 015 0v2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span>${html}</span></p>`;
}

let tt;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),3200); }

$("#items").addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b) return;
  const id = +b.dataset.id, act=b.dataset.act;
  if(act==="received"){
    const i = data.you.findIndex(x=>x.id===id); const it=data.you[i];
    data.you.splice(i,1); render();
    toast(it.hidden ? `Moved to Received. ${it.hidden} bought this for you.` : `Moved to Received.`);
    return;
  }
  const it = data.maya.find(x=>x.id===id);
  if(act==="reserve"){ it.claim={by:"you",state:"reserved"}; toast("Reserved. Maya won’t see this."); }
  if(act==="bought"){ it.claim={by:"you",state:"bought"}; toast("Marked bought. Maya won’t see this."); }
  if(act==="undo"){ it.claim=null; toast("Claim removed."); }
  render();
  const again = document.querySelector(`[data-id="${id}"]`); if(again) again.focus();
});

document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{state.who=t.dataset.who; state.occ="All"; chips(); render();});
$("#asmaya").onchange=e=>{state.asMaya=e.target.checked; render();};
$("#sort").onchange=e=>{state.sort=e.target.value; render();};
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{
  state.view=b.dataset.view;
  document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed", String(x===b)));
  render();
});
$("#addForm").onsubmit=e=>{
  e.preventDefault(); const v=$("#url").value.trim();
  if(!v){ toast("Paste a link from any store to add it."); $("#url").focus(); return; }
  let host; try{ host=new URL(v).hostname.replace(/^www\./,""); }catch{ toast("That doesn’t look like a link. Copy the address from your browser and try again."); return; }
  data.you.unshift({id:Date.now(),title:"Reading product details…",store:host,price:0,currency:"USD",priority:5,occ:"Just because",tint:"#E6E8EF",art:"lamp",added:0});
  $("#url").value=""; state.who="you"; state.occ="All"; chips(); render();
  toast(`Added to your list from ${host}.`);
};

chips(); render();
</script>
</body>
</html>
