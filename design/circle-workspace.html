<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GiftHub Circle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --blush:#FFE4EC;
  --blush-deep:#FFD3E0;
  --print:#FFFFFF;
  --plum:#3B1D3F;
  --plum-hover:#552B5A;
  --plum-soft:#74557A;
  --edge:#F2CFDA;
  --heart-off:#F3D3DD;
  --ribbon:#FF5247;
  --ribbon-deep:#D93A30;
  --ribbon-knot:#A8231B;
  --sky:#7CC4FF;
  --sky-wash:#E2F2FF;
  --sky-ink:#0B4F8A;
  --stamp:#D9570A;
  --r-print:6px;
  --r-photo:3px;
  --font:"Bricolage Grotesque",system-ui,sans-serif;
  /* three sizes only; weight carries rank */
  --fs-display:clamp(30px,4vw,40px);
  --fs-body:15px;
  --fs-small:13px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--blush);color:var(--plum);font:400 var(--fs-body)/1.45 var(--font)}
button,input,select{font:inherit;color:inherit}
::selection{background:var(--sky);color:var(--plum)}
:focus-visible{outline:2px solid var(--plum);outline-offset:2px;border-radius:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* shell */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.rail{background:var(--print);padding:22px 14px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh;border-radius:0 22px 22px 0}
.mark{display:flex;align-items:center;gap:9px;font-weight:800;font-size:20px;letter-spacing:-.02em;padding:0 8px;color:var(--plum);text-decoration:none}
.rail h2{font-size:var(--fs-small);font-weight:600;color:var(--plum-soft);margin:0 10px 6px}
.navlink{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:999px;color:inherit;text-decoration:none;font-weight:600}
.navlink:hover{background:var(--blush)}
.navlink[aria-current="page"]{background:var(--plum);color:#fff}
.navlink[aria-current="page"] .count{color:#F3D3DD}
.count{font-size:var(--fs-small);font-weight:600;color:var(--plum-soft);font-variant-numeric:tabular-nums}
.rail-foot{margin-top:auto;font-size:var(--fs-small);color:var(--plum-soft);padding:0 10px}
.rail-foot b{color:var(--plum);font-weight:800;letter-spacing:.04em}

main{padding:28px clamp(16px,3.4vw,44px) 110px;min-width:0}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px}
h1{font-size:var(--fs-display);line-height:1;letter-spacing:-.035em;font-weight:800;margin:0}
.next{margin:8px 0 0;color:var(--plum-soft)}
.next strong{color:var(--plum);font-weight:600}

.add{display:flex;gap:8px;flex:1 1 360px;max-width:500px}
.add input{flex:1;min-width:0;height:46px;padding:0 18px;border:0;border-radius:999px;background:var(--print);box-shadow:inset 0 0 0 1.5px var(--edge)}
.add input::placeholder{color:#85688A}
.add input:focus-visible{outline:2px solid var(--plum);outline-offset:2px}
.btn{height:40px;padding:0 18px;border-radius:999px;border:0;background:var(--plum);color:#fff;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--plum-hover)}
.btn.ghost{background:var(--print);color:var(--plum);box-shadow:inset 0 0 0 1.5px var(--edge)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--plum-soft);background:var(--print)}
.add .btn{height:46px;padding:0 22px}

.tabs{display:flex;gap:6px;margin:26px 0 0}
.tab{appearance:none;border:0;background:transparent;padding:0 16px;height:38px;border-radius:999px;font-weight:600;color:var(--plum-soft);cursor:pointer}
.tab:hover{background:var(--blush-deep)}
.tab[aria-selected="true"]{background:var(--plum);color:#fff}
.tab .count{margin-left:6px;color:inherit;opacity:.75}

.tools{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin:16px 0 22px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:34px;padding:0 13px;border-radius:999px;border:0;background:transparent;box-shadow:inset 0 0 0 1.5px var(--edge);cursor:pointer;font-size:var(--fs-small);font-weight:600;color:var(--plum)}
.chip:hover{box-shadow:inset 0 0 0 1.5px var(--plum-soft)}
.chip[aria-pressed="true"]{background:var(--print);box-shadow:inset 0 0 0 1.5px var(--plum)}
.tools-right{margin-left:auto;display:flex;gap:12px;align-items:center}
.sort{height:34px;border:0;border-radius:999px;background:var(--print);box-shadow:inset 0 0 0 1.5px var(--edge);padding:0 12px;font-size:var(--fs-small);font-weight:600}
.seg{display:inline-flex;background:var(--print);border-radius:999px;padding:3px;box-shadow:inset 0 0 0 1.5px var(--edge)}
.seg button{border:0;background:none;height:28px;padding:0 12px;border-radius:999px;font-size:var(--fs-small);font-weight:600;cursor:pointer;color:var(--plum-soft)}
.seg button[aria-pressed="true"]{background:var(--plum);color:#fff}

.asmaya{display:flex;align-items:center;gap:10px;font-size:var(--fs-small);font-weight:600;color:var(--plum-soft);cursor:pointer;user-select:none}
.switch{width:38px;height:22px;border-radius:999px;background:var(--edge);position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.asmaya input:checked + .switch{background:var(--plum)}
.asmaya input:checked + .switch::after{transform:translateX(16px)}
.asmaya input:focus-visible + .switch{outline:2px solid var(--plum);outline-offset:2px}

.note{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:14px;background:var(--sky-wash);margin:0 0 20px;font-size:var(--fs-small);color:var(--sky-ink);max-width:72ch}
.note strong{font-weight:800}
.note svg{flex:none;margin-top:1px}

/* the strip: one frame ratio, one white print ground */
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(204px,1fr));gap:22px 18px}
.frame{background:var(--print);border-radius:var(--r-print);padding:8px 8px 0;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(59,29,63,.08)}
.photo{position:relative;aspect-ratio:1;border-radius:var(--r-photo);overflow:hidden;display:grid;place-items:center}
.photo svg.art{width:60%;height:auto;color:var(--plum);opacity:.85;transition:opacity .3s}
.stamp{z-index:2;position:absolute;right:6px;bottom:6px;padding:0 5px;border-radius:3px;background:rgba(255,255,255,.88);font-weight:800;font-size:var(--fs-small);color:var(--stamp);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.sale{position:absolute;left:7px;top:7px;background:var(--sky-wash);color:var(--sky-ink);font-size:var(--fs-small);font-weight:800;padding:2px 9px;border-radius:999px}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .6s cubic-bezier(.25,.8,.25,1)}
@keyframes flash{0%{opacity:0}18%{opacity:.7}100%{opacity:0}}

/* the ribbon (pinned): claims wrap the photo */
.ribbon{position:absolute;inset:0;pointer-events:none}
.ribbon::before,.ribbon::after{content:"";position:absolute;background:var(--ribbon)}
/* unwrap (Undo): bow lifts first, then the bands retract */
.ribbon::before{left:calc(64% - 8px);top:0;bottom:0;width:16px;transform-origin:top;transform:scaleY(0);transition:transform .3s .12s cubic-bezier(.5,0,.75,0),background-color .4s}
.ribbon::after{top:calc(58% - 8px);left:0;right:0;height:16px;transform-origin:left;transform:scaleX(0);transition:transform .3s .08s cubic-bezier(.5,0,.75,0),background-color .4s}
.ribbon .bow{z-index:1;position:absolute;left:64%;top:58%;width:42px;height:29px;transform:translate(-50%,-50%) scale(0);color:var(--ribbon-deep);transition:transform .2s cubic-bezier(.5,0,.75,0),color .4s}
/* wrap: flash, then the vertical band draws down, the horizontal sweeps across, the bow settles */
.claimed .ribbon::before{transform:scaleY(1);transition:transform .55s .2s cubic-bezier(.22,1,.36,1),background-color .4s}
.claimed .ribbon::after{transform:scaleX(1);transition:transform .55s .4s cubic-bezier(.22,1,.36,1),background-color .4s}
.claimed .ribbon .bow{transform:translate(-50%,-50%) scale(1);transition:transform .5s .8s cubic-bezier(.34,1.56,.64,1),color .4s}
.claimed.bought .ribbon::before,.claimed.bought .ribbon::after{background-color:var(--ribbon-deep)}
.claimed.bought .ribbon .bow{color:var(--ribbon-knot)}
.claimed svg.art{opacity:.4;transition:opacity .5s .25s}

.cap{padding:10px 3px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.store{font-size:var(--fs-small);color:var(--plum-soft)}
.title{font-weight:600;font-size:var(--fs-body);line-height:1.25;margin:0}
.title a{color:inherit;text-decoration:none}
.title a:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
.price{font-weight:800;font-variant-numeric:tabular-nums}
.price s{font-weight:400;color:var(--plum-soft);margin-left:6px;font-size:var(--fs-small)}
.hearts{display:flex;gap:2px;align-items:center}
.hearts svg{width:13px;height:13px;color:var(--heart-off)}
.hearts svg.on{color:var(--ribbon-deep)}
.occ{font-size:var(--fs-small);color:var(--plum-soft)}

/* fixed-height claim slot: no layout shift when state changes */
.claim{margin-top:auto;padding-top:8px;display:flex;gap:6px;align-items:center;min-height:48px;flex-wrap:wrap}
.claim .btn{height:34px;padding:0 14px;font-size:var(--fs-small)}
.status{font-size:var(--fs-small);font-weight:800;color:var(--ribbon-deep)}
.linkbtn{border:0;background:none;padding:6px 4px;font-size:var(--fs-small);font-weight:600;color:var(--plum-soft);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--plum)}
.other{font-size:var(--fs-small);color:var(--plum-soft)}

/* list: a truly dense strip */
.list{background:var(--print);border-radius:14px;padding:4px 14px}
.lrow{display:grid;grid-template-columns:48px minmax(0,1fr) 110px 120px 210px;gap:14px;align-items:center;padding:8px 0;border-bottom:1px solid var(--blush)}
.lrow:last-child{border-bottom:0}
.lrow .photo{width:48px;border-radius:6px}
.lrow .photo svg.art{width:74%}
.lrow .stamp,.lrow .ribbon .bow{display:none}
.lrow .ribbon::before{width:5px;left:calc(64% - 2.5px)}
.lrow .ribbon::after{height:5px;top:calc(58% - 2.5px)}
.lrow .title{font-size:var(--fs-small)}
.lrow .cap{padding:0;gap:0}
.lrow .claim{margin:0;padding:0;min-height:34px;justify-content:flex-end;flex-wrap:nowrap}
.lrow .price{font-size:var(--fs-small)}

.preview .ribbon,.preview .claim,.preview .status{display:none}
.preview svg.art{opacity:.85}

.empty{padding:48px 0;color:var(--plum-soft);max-width:52ch}
.empty strong{display:block;color:var(--plum);font-size:var(--fs-body);font-weight:800;margin-bottom:4px}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;background:var(--plum);color:#fff;padding:12px 18px;border-radius:999px;font-size:var(--fs-small);font-weight:600;max-width:calc(100vw - 32px);transition:opacity .2s,transform .25s cubic-bezier(.2,.8,.2,1);pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}

.mobilebar,.bottomnav{display:none}

@media (max-width:899px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .mobilebar{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 0}
  .mobilebar .mark{padding:0;font-size:19px}
  .mobilebar select{border:0;background:var(--print);border-radius:999px;height:36px;padding:0 12px;font-weight:600;max-width:55vw}
  main{padding:18px 16px 120px}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--print);z-index:6;padding-bottom:env(safe-area-inset-bottom);border-radius:22px 22px 0 0;box-shadow:0 -1px 3px rgba(59,29,63,.06)}
  .bottomnav a{flex:1;text-align:center;padding:14px 0 16px;font-size:var(--fs-small);font-weight:600;color:var(--plum-soft);text-decoration:none}
  .bottomnav a[aria-current="page"]{color:var(--plum);font-weight:800}
  .add{flex-basis:100%;max-width:none}
  .tools-right{margin-left:0;width:100%;flex-wrap:wrap;gap:10px}
  .asmaya{flex-basis:100%}
  .sort{flex:1;min-width:0}
  .chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none;width:calc(100% + 32px)}
  .chip{flex:none}
  .strip{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
  .frame{padding:7px 7px 0}
  .title{font-size:var(--fs-body)}
  .claim .btn{padding:0 12px}
  .list{padding:2px 12px}
  .lrow{grid-template-columns:48px minmax(0,1fr) auto;row-gap:4px}
  .lrow .cell-prio,.lrow .cell-occ{display:none}
  .lrow .claim{grid-column:2 / -1;justify-content:flex-start}
  .toast{bottom:88px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="Main">

    <div>
      <h2>Circles</h2>
      <a class="navlink" href="#" aria-current="page">Maya &amp; Sam <span class="count">2</span></a>

  <main>
    <div class="top">

      <form class="add" id="addForm">
        <label class="sr" for="url">Product link</label>
        <input id="url" type="url" placeholder="Paste a link to add a wish" autocomplete="off">
        <button class="btn" type="submit">Add</button>
      </form>
    </div>

    <div class="tabs" role="tablist" aria-label="Members">
      <button class="tab" role="tab" id="tab-maya" aria-selected="true" data-who="maya">Maya<span class="count" id="c-maya"></span></button>

    <div class="tools">

          <option value="low">Price, low to high</option>

          <button type="button" aria-pressed="false" data-view="list">List</button>

    <div id="items" role="tabpanel" aria-labelledby="tab-maya"></div>

    <a href="#" aria-current="page">Circles</a>
    <a href="#">Activity</a>
    <a href="#">Received</a>
  </nav>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const fmt = (n, c) => new Intl.NumberFormat(undefined,{style:"currency",currency:c}).format(n);
const BAND = p => p>=9 ? "Must have" : p>=6 ? "Would love" : "Nice to have";
const HEARTS = p => p>=9 ? 3 : p>=6 ? 2 : 1;
const OCCASIONS = ["Birthday","Anniversary","Holiday","Valentine’s Day","Just because"];
const TODAY = new Date(2026,10,16);
const stampOf = d => { const t=new Date(TODAY); t.setDate(t.getDate()-d); return `’${String(t.getFullYear()).slice(2)} ${String(t.getMonth()+1).padStart(2,"0")} ${String(t.getDate()).padStart(2,"0")}`; };

// Synthetic demo data.
const data = {
  maya: [
    {id:1,title:"75% low-profile mechanical keyboard, brown switches",store:"keychron.com",price:169,currency:"USD",priority:9,occ:"Birthday",tint:"#E8EEFF",art:"keyboard",added:3,claim:null},
    {id:2,title:"The Left Hand of Darkness, illustrated edition",store:"foliosociety.com",price:75,currency:"GBP",priority:8,occ:"Anniversary",tint:"#FFF0E6",art:"book",added:9,claim:{by:"you",state:"bought"}},
    {id:3,title:"Linen overshirt in sage, size M",store:"uniqlo.com",price:39.9,currency:"GBP",priority:7,occ:"Birthday",tint:"#E6F5EC",art:"shirt",added:5,claim:null},
    {id:4,title:"Ethiopia Guji, whole bean, 350 g",store:"squaremilecoffee.com",price:14.5,was:17,currency:"GBP",priority:6,occ:"Just because",tint:"#FFF6DD",art:"coffee",added:1,claim:null},
    {id:5,title:"Hand-thrown ceramic pour-over dripper",store:"etsy.com",price:48,currency:"USD",priority:6,occ:"Holiday",tint:"#F1EAFF",art:"dripper",added:12,claim:{other:true}},
    {id:6,title:"Merino hiking socks, three pairs",store:"darntough.com",price:72,currency:"USD",priority:5,occ:"Holiday",tint:"#FFEAF0",art:"socks",added:7,claim:null},
    {id:7,title:"Foldable travel hair dryer",store:"amazon.de",price:29.99,was:34.99,currency:"EUR",priority:3,occ:"Just because",tint:"#E3F4FF",art:"dryer",added:2,claim:null},
  ],
  you: [
    {id:11,title:"Brass fountain pen, fine nib",store:"kaweco-pen.com",price:89,currency:"EUR",priority:9,occ:"Birthday",tint:"#FFF6DD",art:"pen",added:4,hidden:"Maya"},
    {id:12,title:"Small olive tree, 60 cm",store:"bloomandwild.com",price:55,currency:"GBP",priority:7,occ:"Anniversary",tint:"#E6F5EC",art:"plant",added:6},
    {id:13,title:"Pleated paper table lamp",store:"muji.com",price:45,currency:"EUR",priority:4,occ:"Just because",tint:"#E8EEFF",art:"lamp",added:2},
  ]
};

const state = {who:"maya", occ:"All", sort:"prio", view:"grid", asMaya:false};
const $ = s => document.querySelector(s);

function chips(){
  const el = $("#chips"); el.innerHTML = "";
  ["All",...OCCASIONS].forEach(o=>{
    const b=document.createElement("button");
    b.className="chip"; b.type="button"; b.textContent=o;
    b.setAttribute("aria-pressed", String(o===state.occ));
    b.onclick=()=>{state.occ=o; chips(); render();};
    el.appendChild(b);
  });
}

const hearts = p => `<span class="hearts" role="img" aria-label="${BAND(p)}, priority ${p} of 10" title="${BAND(p)}">${[1,2,3].map(i=>`<svg class="${i<=HEARTS(p)?"on":""}" viewBox="0 0 16 16" aria-hidden="true"><use href="#heart"/></svg>`).join("")}</span>`;

function claimUI(it){
  if(state.who!=="maya") return `<div class="claim"><button class="btn ghost" data-act="received" data-id="${it.id}">Mark received</button></div>`;
  if(it.claim?.other) return `<div class="claim"><span class="other">Claimed in Friday dinner crew</span></div>`;
  if(!it.claim) return `<div class="claim"><button class="btn" data-act="reserve" data-id="${it.id}">Reserve</button><button class="linkbtn" data-act="bought" data-id="${it.id}">I bought it</button></div>`;
  if(it.claim.state==="reserved") return `<div class="claim"><span class="status">Reserved by you</span><button class="linkbtn" data-act="bought" data-id="${it.id}">Mark bought</button><button class="linkbtn" data-act="undo" data-id="${it.id}">Undo</button></div>`;
  return `<div class="claim"><span class="status">Bought by you</span><button class="linkbtn" data-act="undo" data-id="${it.id}">Undo</button></div>`;
}

function photo(it){
  const c = state.who==="maya" && it.claim;
  const cls = c ? `claimed ${it.claim.state==="bought"||it.claim.other?"bought":""}` : "";
  return `<div class="photo ${cls}" style="background:${it.tint}" data-photo="${it.id}">
    <svg class="art" viewBox="0 0 120 80" aria-hidden="true"><use href="#a-${it.art}"/></svg>
    ${it.was && state.view!=="list" ? `<span class="sale">Sale</span>`:""}
    <span class="stamp" aria-label="Added ${stampOf(it.added)}">${stampOf(it.added)}</span>
    <span class="ribbon" aria-hidden="true"><svg class="bow"><use href="#bow"/></svg></span>
    <span class="flash" aria-hidden="true"></span>
  </div>`;
}

const priceHTML = it => `<span class="price">${fmt(it.price,it.currency)}${it.was?`<s><span class="sr">was </span>${fmt(it.was,it.currency)}</s>`:""}</span>`;

function render(){
  const list = data[state.who].filter(i=>state.occ==="All"||i.occ===state.occ).slice();
  list.sort((a,b)=> state.sort==="prio" ? b.priority-a.priority : state.sort==="low" ? a.price-b.price : a.added-b.added);

  $("#heading").textContent = state.who==="maya" ? "Maya’s list" : "Your list";
  $("#next").innerHTML = state.who==="maya"
    ? `<strong>Maya’s birthday</strong> is in 23 days, on 9 December.`
    : `Shared with Maya &amp; Sam and Friday dinner crew.`;
  $("#c-maya").textContent = data.maya.length; $("#c-you").textContent = data.you.length;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected", String(t.dataset.who===state.who)));
  $("#items").setAttribute("aria-labelledby", "tab-"+state.who);
  $("#asmayaWrap").style.display = state.who==="maya" ? "" : "none";

  const owner = state.who==="you";
  const preview = state.who==="maya" && state.asMaya;
  $("#noteSlot").innerHTML = owner
    ? note(`<strong>You won’t see who is buying what.</strong> Claims on your items stay hidden until you mark an item received.`)
    : preview ? note(`<strong>This is what Maya sees.</strong> Her list looks untouched. Claims are never sent to her device.`) : "";

  const wrap = $("#items");
  wrap.classList.toggle("preview", preview);
  if(!list.length){
    wrap.innerHTML = `<div class="empty"><strong>Nothing tagged ${state.occ} yet.</strong>${owner?"Add a wish and tag it with this occasion so Maya can find it.":"Try another occasion, or look at everything Maya has added."}</div>`;
    return;
  }
  if(state.view==="grid"){
    wrap.innerHTML = `<div class="strip">${list.map(it=>`
      <article class="frame">
        ${photo(it)}
        <div class="cap">
          <span class="store">${it.store}</span>
          <h3 class="title"><a href="#">${it.title}</a></h3>
          <div class="row">${priceHTML(it)}${hearts(it.priority)}</div>
          <span class="occ">${it.occ}</span>
          ${claimUI(it)}
        </div>
      </article>`).join("")}</div>`;
  } else {
    wrap.innerHTML = `<div class="list">${list.map(it=>`
      <article class="lrow">
        ${photo(it)}
        <div class="cap"><span class="store">${it.store}</span><h3 class="title"><a href="#">${it.title}</a></h3></div>
        <div>${priceHTML(it)}${it.was?`<div class="occ" style="color:var(--sky-ink);font-weight:800">On sale</div>`:""}</div>
        <div class="cell-prio">${hearts(it.priority)}</div>
        ${claimUI(it)}
      </article>`).join("")}</div>`;
  }
}

const note = html => `<p class="note"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5.5 7V5a2.5 2.5 0 015 0v2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span>${html}</span></p>`;

let tt;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),3200); }

// Signature moment: the booth flash, then the ribbon wraps the photo.
function snap(id){
  const f = document.querySelector(`[data-photo="${id}"] .flash`);
  if(f){ f.classList.remove("go"); void f.offsetWidth; f.classList.add("go"); }
}
const photoEl = id => document.querySelector(`[data-photo="${id}"]`);
const wrapState = el => el ? [...el.classList].filter(c=>c==="claimed"||c==="bought") : [];

$("#items").addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b) return;
  const id = +b.dataset.id, act=b.dataset.act;
  if(act==="received"){
    const i = data.you.findIndex(x=>x.id===id); const it=data.you[i];
    data.you.splice(i,1); render();
    toast(it.hidden ? `Moved to Received. ${it.hidden} bought this for you.` : `Moved to Received.`);
    return;
  }
  const it = data.maya.find(x=>x.id===id);
  const before = wrapState(photoEl(id));
  if(act==="reserve"){ it.claim={by:"you",state:"reserved"}; toast("Reserved. Maya won’t see this."); }
  if(act==="bought"){ it.claim={by:"you",state:"bought"}; toast("Marked bought. Maya won’t see this."); }
  if(act==="undo"){ it.claim=null; toast("Claim removed."); }
  render();
  // render() rebuilds the frame already in its final state, which skips the
  // transition. Put the new photo back in its old state, then move it to the
  // new one on the next frame so the wrap, recolour or unwrap animates.
  const el = photoEl(id);
  if(el){
    const after = wrapState(el);
    el.classList.remove("claimed","bought"); el.classList.add(...before);
    void el.offsetWidth;
    if(!before.length && after.length) snap(id);
    requestAnimationFrame(()=>{ el.classList.remove("claimed","bought"); el.classList.add(...after); });
  }
  const again = document.querySelector(`[data-id="${id}"]`); if(again) again.focus();
});

document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{state.who=t.dataset.who; state.occ="All"; chips(); render();});
$("#asmaya").onchange=e=>{state.asMaya=e.target.checked; render();};
$("#sort").onchange=e=>{state.sort=e.target.value; render();};
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{
  state.view=b.dataset.view;
  document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed", String(x===b)));
  render();
});
$("#addForm").onsubmit=e=>{
  e.preventDefault(); const v=$("#url").value.trim();
  if(!v){ toast("Paste a link from any store to add it."); $("#url").focus(); return; }
  let host; try{ host=new URL(v).hostname.replace(/^www\./,""); }catch{ toast("That doesn’t look like a link. Copy the address from your browser and try again."); return; }
  data.you.unshift({id:Date.now(),title:"Reading product details…",store:host,price:0,currency:"USD",priority:5,occ:"Just because",tint:"#F4EDF6",art:"lamp",added:0});
  $("#url").value=""; state.who="you"; state.occ="All"; chips(); render();
  toast(`Added to your list from ${host}.`);
};

chips(); render();
</script>
</body>
</html>
